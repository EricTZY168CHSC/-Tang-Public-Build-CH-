<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级内部资料共享站</title>
    <style>
        :root {
            --bg-color: #f5f7fa;
            --text-color: #333;
            --primary-color: #4a90e2;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 700px;
            width: 90%;
            margin-top: 60px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        /* 状态指示灯 */
        .status-badge {
            display: inline-block;
            background-color: #e6f4ea;
            color: #1e8e3e;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            margin-top: 10px;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #1e8e3e;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(30, 142, 62, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(30, 142, 62, 0); }
            100% { box-shadow: 0 0 0 0 rgba(30, 142, 62, 0); }
        }

        /* 卡片样式 */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .card h2 {
            margin-top: 0;
            color: #222;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .card p {
            line-height: 1.6;
            color: #555;
        }

        /* 局域网IP展示 */
        .ip-box {
            background-color: #f8f9fa;
            border: 1px dashed #ccc;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            font-family: monospace;
            font-size: 1.2em;
            color: var(--primary-color);
            margin-top: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .ip-box:hover {
            background-color: #eef2f5;
        }

        footer {
            margin-top: auto;
            padding: 30px;
            color: #999;
            font-size: 0.9em;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>内部资料共享站</h1>
            <p>专为同学打造的高速 P2P 文件传输服务</p>
            <div class="status-badge">
                <span class="status-dot"></span> ZeroTier 节点在线
            </div>
        </div>

        <div class="card">
            <h2>📁 资源访问</h2>
            <p>本服务运行在 ZeroTier 虚拟局域网中，不经过外部公网，传输速度拉满，且绝对安全。</p>
            <p>请确保你已加入我们的 ZeroTier 网络，然后在浏览器访问以下地址：</p>
            
            <!-- 提示：把这里改成你电脑的 ZeroTier IP 和端口 -->
            <div class="ip-box" onclick="copyIP()" title="点击复制">
                http://10.147.20.5:8080
            </div>
            <p style="font-size: 0.85em; color: #888; text-align: center; margin-top: 8px;">（点击上方地址即可复制）</p>
        </div>

        <div class="card">
            <h2>💡 使用说明</h2>
            <p>
                1. 下载并安装 ZeroTier，加入我们的网络 ID。<br>
                2. 复制上方地址，在浏览器中打开。<br>
                3. 即可直接下载或上传大文件（无 800MB 限制，最高可跑满局域网带宽）。
            </p>
        </div>
    </div>

    <footer>
        © 2026 班级内部维护 | 请勿外传
    </footer>

    <script>
        function copyIP() {
            const ipText = "http://10.147.20.5:8080"; // 记得同步改这里的 IP
            navigator.clipboard.writeText(ipText).then(() => {
                alert("地址已复制：" + ipText);
            }).catch(err => {
                console.error('复制失败: ', err);
            });
        }
    </script>
</body>
</html>
